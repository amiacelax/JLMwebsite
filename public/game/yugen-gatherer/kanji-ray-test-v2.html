<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanji Ray v2 — Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #05060a; color: #fff; overflow: hidden; }
    #yg-root {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #yg-canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .sim-hud {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
      z-index: 2;
    }
    .sim-hud-title {
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .sim-hud-desc {
      font-family: monospace;
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.45);
      max-width: 28rem;
    }
    .nav-links {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      z-index: 2;
      font-family: monospace;
      font-size: 0.75rem;
      pointer-events: none;
    }
    .nav-links a {
      pointer-events: all;
      color: rgba(255, 255, 255, 0.55);
      text-decoration: none;
    }
    .nav-links a:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="yg-root">
    <nav class="nav-links" aria-label="Navigation">
      <a href="/game/yugen-gatherer/kanji-ray-test.html">← v1</a>
      <a href="/game/yugen-gatherer/">Yūgen →</a>
    </nav>
    <canvas id="yg-canvas" aria-label="Room — kanji glyphs"></canvas>
  </div>
  <script type="module" src="/game/yugen-gatherer/js/kanji-ray-v2.js"></script>
</body>
</html>
