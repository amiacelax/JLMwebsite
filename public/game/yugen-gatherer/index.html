<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Yūgen Gatherer — 3D typographic adventure in the Japanese countryside">
  <title>幽玄の採集者 — Yūgen Gatherer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/game/yugen-gatherer/yugen.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="yg-root">
    <canvas id="yg-canvas" aria-label="Yūgen Gatherer typographic 3D world"></canvas>

    <div id="yg-vignette" aria-hidden="true"></div>

    <div id="yg-prompt" class="yg-prompt" hidden>
      <span id="yg-prompt-text"></span>
      <kbd>E</kbd>
    </div>

    <div id="yg-hud" class="yg-hud">
      <p class="yg-hud__title" id="yg-hud-title">幽玄の採集者</p>
      <p class="yg-hud__phase" id="yg-hud-zone">町の中心</p>
    </div>

    <div id="yg-controls-hint" class="yg-controls-hint">
      <span>WASD move · E enter torii</span>
      <span>Text-built world — Paper Mario angle</span>
    </div>

    <a class="yg-back" href="/games.html">← Games</a>

    <div id="yg-fade" class="yg-fade" hidden aria-hidden="true"></div>
  </div>

  <script type="module" src="/game/yugen-gatherer/js/game.js"></script>
</body>
</html>
