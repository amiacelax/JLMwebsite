<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Lantern Kanji Hunt — shine your lantern to find the right kanji before time runs out">
  <title>Lantern Kanji Hunt — Japanese Language Mentor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/kumo.css">
  <link rel="stylesheet" href="/game/lantern-hunt/lantern.css">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      else document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body class="lhn-body lhn-body--learning">
  <header class="lhn-header">
    <div>
      <h1 class="lhn-header__title">Lantern Kanji Hunt</h1>
      <p class="lhn-header__sub" id="lhn-header-sub">Shine your lantern · find the word</p>
    </div>
    <a class="lhn-header__back" href="/games.html">← Games</a>
  </header>

  <main class="lhn-main">
    <div class="lhn-hud" aria-live="polite">
      <div class="lhn-hud__item">
        <span class="lhn-hud__label">Score</span>
        <span class="lhn-hud__value" id="lhn-score">0</span>
      </div>
      <div class="lhn-hud__item" id="lhn-timer-wrap">
        <span class="lhn-hud__label">Time</span>
        <span class="lhn-hud__value" id="lhn-timer">5</span>
      </div>
      <div class="lhn-hud__item" id="lhn-streak-wrap">
        <span class="lhn-hud__label">Streak</span>
        <span class="lhn-hud__value" id="lhn-streak">0</span>
      </div>
    </div>

    <p class="lhn-toast" id="lhn-toast" role="status" aria-live="assertive" hidden></p>

    <div class="lhn-stage-wrap">
      <div class="lhn-clear" id="lhn-clear" hidden>
        <div class="lhn-clear__fireworks" id="lhn-fireworks" aria-hidden="true"></div>
        <p class="lhn-clear__title">ゲームクリア！</p>
        <p class="lhn-clear__sub">All 14 rounds cleared</p>
        <p class="lhn-clear__score" id="lhn-clear-score">Score 0</p>
      </div>
      <div class="lhn-stage" id="lhn-stage" tabindex="0" aria-label="Dark field — move pointer to shine your lantern">
        <div class="lhn-hearts" id="lhn-hearts" aria-label="3 lives"></div>
        <div class="lhn-words" id="lhn-words"></div>
        <div class="lhn-floats" id="lhn-floats" aria-hidden="true"></div>
        <div class="lhn-veil" id="lhn-veil" aria-hidden="true"></div>
        <div class="lhn-glow" id="lhn-glow" aria-hidden="true"></div>
        <p class="lhn-stage__hint" id="lhn-stage-hint">Move mouse or finger to light the dark</p>
      </div>
    </div>

    <div class="lhn-find" id="lhn-find-panel" aria-live="polite">
      <span class="lhn-find__label">Find this word</span>
      <p class="lhn-find__prompt">
        <span class="lhn-find__reading" id="lhn-target-reading">—</span>
        <span class="lhn-find__meaning" id="lhn-target-meaning"></span>
      </p>
      <p class="lhn-find__sub" id="lhn-find-sub">Press New game when you are ready</p>
    </div>

    <section class="lhn-mode" aria-labelledby="lhn-mode-heading">
      <h2 class="lhn-mode__heading" id="lhn-mode-heading">Mode</h2>
      <div class="lhn-mode__options" role="group" aria-label="Game mode">
        <button type="button" class="lhn-mode__btn" data-lhn-mode="learning" aria-pressed="true">Learning</button>
        <button type="button" class="lhn-mode__btn" data-lhn-mode="timeAttack" aria-pressed="false">Time attack</button>
      </div>
    </section>

    <section class="lhn-settings" aria-labelledby="lhn-settings-heading">
      <h2 class="lhn-mode__heading" id="lhn-settings-heading">Settings</h2>
      <label class="lhn-toggle">
        <input type="checkbox" class="lhn-toggle__input" id="lhn-hints-toggle">
        <span class="lhn-toggle__track" aria-hidden="true"></span>
        <span class="lhn-toggle__label">Show reading hints on words</span>
      </label>
    </section>

    <div class="lhn-controls">
      <button type="button" class="lhn-btn lhn-btn--primary" id="lhn-action">New game</button>
    </div>

  </main>

  <script src="/game/lantern-hunt/lantern.js?v=20260633" defer></script>
  <script src="/js/kumo-wallpaper.js" defer></script>
</body>
</html>
