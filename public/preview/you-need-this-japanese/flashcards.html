<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0b162a">
  <title>Core Japanese flashcards — Japanese Language Mentor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@400;600&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b162a;
      --bg-2: #121f36;
      --ink: #e8edf5;
      --muted: #9aa8bd;
      --line: rgba(232, 237, 245, 0.14);
      --day: #67c4eb;
      --teal: #3dbaa8;
      --sun: #f0b429;
      --font: Inter, "Noto Sans JP", system-ui, sans-serif;
      --brand: "Josefin Sans", Inter, sans-serif;
      --jp: "Noto Sans JP", Inter, sans-serif;
      --pad: clamp(1rem, 4vw, 1.5rem);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 40% at 100% 0%, rgba(103, 196, 235, 0.18), transparent 50%),
        var(--bg);
      color-scheme: dark;
    }
    .shell { max-width: 40rem; margin: 0 auto; padding: var(--pad); min-height: 100%; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.8rem; }
    .brand { margin: 0; font-family: var(--brand); letter-spacing: 0.04em; color: var(--day); font-size: 0.92rem; }
    .back { color: var(--muted); font-size: 0.92rem; }
    h1 { margin: 0.35rem 0 0.6rem; font-family: var(--brand); font-weight: 600; font-size: 1.55rem; }
    .sets { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.8rem; }
    .sets button {
      font: inherit;
      color: var(--ink);
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
    }
    .sets button.is-on { border-color: var(--day); color: var(--day); }
    .stage { flex: 1; display: flex; flex-direction: column; gap: 0.75rem; }
    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: color-mix(in srgb, var(--bg-2) 92%, white);
      border: 1px solid var(--line);
      border-radius: 1.2rem;
      padding: 0.9rem 0.9rem 1.1rem;
      cursor: pointer;
      min-height: 22rem;
    }
    .pic-wrap {
      width: min(100%, 22rem);
      aspect-ratio: 1;
      background: #f7f4ee;
      border-radius: 1rem;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }
    .pic-wrap img { width: 86%; height: 86%; object-fit: contain; }
    .num {
      position: absolute;
      right: 0.7rem;
      bottom: 0.35rem;
      font-family: var(--brand);
      font-size: 4.2rem;
      line-height: 1;
      color: #1d3d73;
      text-shadow: 0 2px 0 rgba(255,255,255,0.65);
    }
    .jp { font-family: var(--jp); font-weight: 700; font-size: clamp(1.7rem, 6vw, 2.3rem); margin: 0.85rem 0 0.25rem; }
    .en { margin: 0; color: var(--muted); min-height: 1.4em; font-size: 1.05rem; }
    .card.is-hidden .en { visibility: hidden; }
    .hint { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.82rem; }
    .nav { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
    .nav button {
      flex: 1;
      font: inherit;
      font-weight: 650;
      font-size: 1.05rem;
      padding: 0.85rem 0.5rem;
      border-radius: 0.9rem;
      border: 1px solid var(--line);
      background: var(--bg-2);
      color: var(--ink);
      cursor: pointer;
    }
    .nav .next { background: color-mix(in srgb, var(--day) 22%, var(--bg-2)); border-color: color-mix(in srgb, var(--day) 55%, var(--line)); }
    .prog { text-align: center; color: var(--muted); margin: 0.55rem 0 0; font-size: 0.9rem; }
    .foot { margin: 1rem 0 0.4rem; color: var(--muted); font-size: 0.8rem; }
    .foot a { color: var(--day); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <p class="brand">Japanese Language Mentor</p>
      <a class="back" href="index.html">Word list</a>
    </div>
    <h1>Flashcards</h1>
    <div class="sets" id="sets"></div>
    <div class="stage">
      <button type="button" class="card is-hidden" id="card">
        <div class="pic-wrap">
          <img id="pic" alt="">
          <span class="num" id="num" hidden></span>
        </div>
        <p class="jp" id="jp" lang="ja"></p>
        <p class="en" id="en"></p>
        <p class="hint" id="hint">Tap the card for English</p>
      </button>
      <div class="nav">
        <button type="button" id="prev">Back</button>
        <button type="button" class="next" id="next">Next</button>
      </div>
      <p class="prog" id="prog"></p>
    </div>
    <p class="foot">Pictures: <a href="https://www.irasutoya.com/" target="_blank" rel="noopener noreferrer">いらすとや</a>. Dates share a calendar. The number on the card is the day.</p>
  </div>

    var setId = 1;
    var index = 0;
    var open = false;
    var params = new URLSearchParams(location.search);
    if (params.get("set")) setId = Number(params.get("set")) || 1;

    var setsEl = document.getElementById("sets");
    var cardEl = document.getElementById("card");
    var picEl = document.getElementById("pic");
    var numEl = document.getElementById("num");
    var jpEl = document.getElementById("jp");
    var enEl = document.getElementById("en");
    var progEl = document.getElementById("prog");

    function currentSet() {
      return DATA.sets.filter(function (s) { return s.id === setId; })[0] || DATA.sets[0];
    }

    function show() {
      var set = currentSet();
      var cards = set.cards;
      if (index < 0) index = cards.length - 1;
      if (index >= cards.length) index = 0;
      var card = cards[index];
      var file = DATA.files[card.img] || DATA.files.calendar;
      picEl.src = "img/" + file;
      picEl.alt = "";
      jpEl.textContent = card.jp;
      enEl.textContent = card.en;
      if (card.num) {
        numEl.hidden = false;
        numEl.textContent = card.num;
      } else {
        numEl.hidden = true;
        numEl.textContent = "";
      }
      open = false;
      cardEl.classList.add("is-hidden");
      progEl.textContent = set.topic + "  ·  " + (index + 1) + " / " + cards.length;
      history.replaceState(null, "", "?set=" + set.id);
    }

    DATA.sets.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s.id === 8 ? s.topic : s.id + " " + s.topic;
      b.dataset.id = String(s.id);
      b.addEventListener("click", function () {
        setId = s.id;
        index = 0;
        paintSets();
        show();
      });
      setsEl.appendChild(b);
    });

    function paintSets() {
      var buttons = setsEl.querySelectorAll("button");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle("is-on", Number(buttons[i].dataset.id) === setId);
      }
    }

    cardEl.addEventListener("click", function () {
      open = !open;
      cardEl.classList.toggle("is-hidden", !open);
    });
    document.getElementById("next").addEventListener("click", function () { index += 1; show(); });
    document.getElementById("prev").addEventListener("click", function () { index -= 1; show(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { index += 1; show(); }
      if (e.key === "ArrowLeft") { index -= 1; show(); }
      if (e.key === " ") { e.preventDefault(); cardEl.click(); }
    });

    paintSets();
    show();
  </script>
