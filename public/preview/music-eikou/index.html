<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#d9cbb0">
  <title>栄光・尊厳 — Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2c2419;
      --chord: #3d3226;
      --ruby: #6a5844;
      --btn: #4a3d2e;
      --btn-on: #a33a3a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      background: #5a4a38;
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(0.9rem + var(--safe-top)) 0.9rem calc(0.9rem + var(--safe-bot));
    }
    .sheet {
      width: min(640px, 100%);
      min-height: min(860px, calc(100dvh - 1.8rem - var(--safe-top) - var(--safe-bot)));
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(ellipse 80% 50% at 12% 8%, rgba(255, 255, 255, 0.22), transparent 55%),
        radial-gradient(ellipse 60% 40% at 88% 92%, rgba(120, 90, 50, 0.14), transparent 50%),
        radial-gradient(ellipse 30% 20% at 70% 30%, rgba(140, 110, 70, 0.08), transparent 60%),
        linear-gradient(168deg, #f4ead4 0%, #ebe0c6 42%, #e2d2b4 78%, #d9c7a8 100%);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.35) inset,
        0 -1px 0 rgba(90, 70, 40, 0.12) inset,
        0 22px 48px rgba(0, 0, 0, 0.38),
        0 2px 6px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(90, 70, 40, 0.22);
    }
    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    .sheet::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 80px rgba(120, 90, 50, 0.12),
        inset 0 0 18px rgba(80, 55, 30, 0.08);
    }
    .lyrics {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2rem, 7vw, 3.25rem) clamp(1.1rem, 4.5vw, 2.5rem) 1.25rem;
      position: relative;
      z-index: 1;
    }
    .song {
      margin: 0;
      max-width: 100%;
      font-size: clamp(1.15rem, 4.2vw, 1.75rem);
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.02em;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: normal;
      color: var(--ink);
    }
    .song .c {
      color: var(--chord);
      font-weight: 700;
      font-size: 0.5em;
    }
    ruby { ruby-position: over; }
    rt {
      font-size: 0.4em;
      font-weight: 500;
      color: var(--ruby);
      letter-spacing: 0;
    }
    .rec {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1rem 1.25rem;
      border-top: 1px dashed rgba(90, 70, 40, 0.28);
      background: linear-gradient(180deg, rgba(255, 250, 235, 0.2), rgba(210, 190, 150, 0.18));
    }
    .rec__row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
    }
    .rec-btn {
      appearance: none;
      border: 1px solid rgba(70, 55, 35, 0.35);
      border-radius: 999px;
      min-width: 7.25rem;
      min-height: 42px;
      padding: 0.5rem 1.1rem;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: #f6efe3;
      background: var(--btn);
      cursor: pointer;
    }
    .rec-btn.is-recording {
      background: var(--btn-on);
      border-color: #7a2a2a;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .rec-btn--ghost {
      background: rgba(255, 248, 230, 0.85);
      color: var(--ink);
      border-color: rgba(70, 55, 35, 0.28);
    }
    .rec-btn--ghost[hidden] { display: none; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(163, 58, 58, 0.28); }
      50% { box-shadow: 0 0 0 8px rgba(163, 58, 58, 0); }
    }
    .rec__audio {
      width: min(100%, 260px);
      height: 34px;
    }
    .rec__audio[hidden] { display: none; }
    .rec__status {
      margin: 0;
      min-height: 1.1em;
      font-size: 0.7rem;
      font-weight: 500;
      color: rgba(70, 55, 35, 0.62);
      text-align: center;
    }
    .rec__status.is-error { color: #9b2c2c; }
    .en {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 0.85rem clamp(1.1rem, 4.5vw, 2.5rem) 1.35rem;
      border-top: 1px dashed rgba(90, 70, 40, 0.22);
      font-size: clamp(0.55rem, 1.85vw, 0.72rem);
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0.01em;
      white-space: pre-wrap;
      color: rgba(70, 55, 35, 0.72);
      text-align: left;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="lyrics">
      <p class="song" lang="ja"><span class="c">  F         Dm    Bb       C</span>
<ruby>栄光<rt>えいこう</rt></ruby>　<ruby>尊厳<rt>そんげん</rt></ruby>　<ruby>力<rt>ちから</rt></ruby>は　<ruby>主<rt>しゅ</rt></ruby>のもの

<span class="c">  F         Dm         Bb         C        F</span>
<ruby>栄光<rt>えいこう</rt></ruby>　ほまれ　<ruby>賛美<rt>さんび</rt></ruby>は　<ruby>主<rt>しゅ</rt></ruby>のもの</p>
    </div>
    <div class="rec">
      <div class="rec__row">
        <button type="button" class="rec-btn" id="rec-toggle" aria-pressed="false">Record</button>
        <button type="button" class="rec-btn rec-btn--ghost" id="rec-download" hidden>Download</button>
      </div>
      <audio class="rec__audio" id="rec-audio" controls hidden></audio>
      <p class="rec__status" id="rec-status">Record audio</p>
    </div>
    <p class="en" lang="en">Glory, majesty, and power
These things belong to the Lord

Glory, honor, and praise
These things belong to the Lord</p>
  </main>
  <script>
    (function () {
      const toggle = document.getElementById("rec-toggle");
      const downloadBtn = document.getElementById("rec-download");
      const audioEl = document.getElementById("rec-audio");
      const statusEl = document.getElementById("rec-status");
      let recorder = null;
      let stream = null;
      let chunks = [];
      let blobUrl = "";
      let mimeType = "";

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.classList.toggle("is-error", Boolean(isError));
      }

      function pickMime() {
        if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
        const types = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/ogg;codecs=opus",
        ];
        return types.find((t) => MediaRecorder.isTypeSupported(t)) || "";
      }

      function clearPlayback() {
        if (blobUrl) URL.revokeObjectURL(blobUrl);
        blobUrl = "";
        audioEl.removeAttribute("src");
        audioEl.hidden = true;
        downloadBtn.hidden = true;
      }

      function stopStream() {
        if (!stream) return;
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }

      async function startRec() {
        if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
          setStatus("Recording not available here.", true);
          return;
        }
        clearPlayback();
        chunks = [];
        mimeType = pickMime();
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch {
          setStatus("Allow the microphone, then try again.", true);
          return;
        }
        try {
          recorder = mimeType
            ? new MediaRecorder(stream, { mimeType })
            : new MediaRecorder(stream);
        } catch {
          recorder = new MediaRecorder(stream);
        }
        mimeType = recorder.mimeType || mimeType || "audio/webm";
        recorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size) chunks.push(ev.data);
        };
        recorder.onstop = () => {
          stopStream();
          const blob = new Blob(chunks, { type: mimeType });
          chunks = [];
          if (!blob.size) {
            setStatus("Nothing recorded. Try again.", true);
            return;
          }
          blobUrl = URL.createObjectURL(blob);
          audioEl.src = blobUrl;
          audioEl.hidden = false;
          downloadBtn.hidden = false;
          downloadBtn.dataset.ext = mimeType.includes("mp4")
            ? "m4a"
            : mimeType.includes("ogg")
              ? "ogg"
              : "webm";
          setStatus("Ready to play");
        };
        recorder.start();
        toggle.textContent = "Stop";
        toggle.classList.add("is-recording");
        toggle.setAttribute("aria-pressed", "true");
        setStatus("Recording…");
      }

      function stopRec() {
        if (!recorder || recorder.state === "inactive") return;
        recorder.stop();
        recorder = null;
        toggle.textContent = "Record";
        toggle.classList.remove("is-recording");
        toggle.setAttribute("aria-pressed", "false");
        setStatus("Saving…");
      }

      toggle.addEventListener("click", () => {
        if (toggle.classList.contains("is-recording")) stopRec();
        else void startRec();
      });

      downloadBtn.addEventListener("click", () => {
        if (!blobUrl) return;
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = "eikou-songen." + (downloadBtn.dataset.ext || "webm");
        a.click();
      });

      document.addEventListener("dblclick", (ev) => {
        if (ev.target.closest("button, a, audio")) return;
        const el = document.documentElement;
        if (!document.fullscreenElement) el.requestFullscreen?.().catch(() => {});
        else document.exitFullscreen?.().catch(() => {});
      });
    })();
  </script>
</body>
</html>
