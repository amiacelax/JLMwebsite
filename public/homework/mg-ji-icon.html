<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>字 lens icon — WIP preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #2d6a4f;
      --bg: #0a0a0a;
      --panel: #141414;
      --text: #e8e8e8;
      --muted: #888;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 56rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .lead {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .grid--parts {
      margin-top: 1.5rem;
      grid-template-columns: 1fr 1fr 1fr;
    }

    @media (max-width: 900px) {
      .grid--parts { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid #222;
      border-radius: 1rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .panel__label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .icon-stage {
      width: min(100%, 28rem);
      aspect-ratio: 148 / 170;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      padding: 2.5rem 3rem;
    }

    .icon-stage--ref {
      background: #fff;
    }

    .icon-stage--icon {
      background: #000;
    }

    .icon-stage img,
    .icon-stage svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
      align-items: flex-end;
      margin-top: 2.5rem;
      padding: 2rem;
      background: var(--panel);
      border: 1px solid #222;
      border-radius: 1rem;
    }

    .size-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .size-chip svg {
      color: var(--green);
    }

    .downloads {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .downloads a {
      color: var(--green);
      font-size: 0.9rem;
    }

    .back {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .back:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/homework/platform.html">← Homework platform</a>
    <h1>字 lens icon (WIP)</h1>
    <p class="lead">Standalone preview — not crammed into the homework widget. Compare against your reference, then download SVG or PNG.</p>

    <div class="grid">
      <div class="panel">
        <span class="panel__label">Your reference</span>
        <div class="icon-stage icon-stage--ref">
          <img src="/images/hw-mg-ji-reference.png?v=4" alt="Reference diagram" width="400" height="480">
        </div>
      </div>
      <div class="panel">
        <span class="panel__label">Current SVG (green, thick)</span>
        <div class="icon-stage icon-stage--icon">
          <img src="/images/hw-mg-ji-icon.svg?v=24" alt="字 lens icon" width="400" height="459">
        </div>
      </div>
    </div>

    <div class="grid grid--parts">
      <div class="panel">
        <span class="panel__label">Line 2 ref</span>
        <div class="icon-stage icon-stage--ref">
          <img src="/images/hw-mg-ji-line2-ref.png" alt="Line 2 reference" width="280" height="200">
        </div>
      </div>
      <div class="panel">
        <span class="panel__label">Line 3 ref</span>
        <div class="icon-stage icon-stage--ref">
          <img src="/images/hw-mg-ji-line3-ref.png" alt="Line 3 reference" width="280" height="200">
        </div>
      </div>
      <div class="panel">
        <span class="panel__label">Lines 2 + 3 (green)</span>
        <div class="icon-stage icon-stage--icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -28 148 130" width="280" height="200" fill="none" aria-hidden="true">
            <g transform="rotate(-40 50 55)" stroke="#2d6a4f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-9 52A59 59 0 0 1 109 52A59 59 0 0 1 93.85 91.48"/>
              <path d="M11.85 60.11A39 39 0 1 1 50 91"/>

          </svg>
        </div>
      </div>
    </div>

    <div class="sizes">
      <div class="size-chip">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -28 148 170" width="50" height="57" fill="none" aria-hidden="true">
          <g transform="rotate(-40 50 55)" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 -11.5V-13.5"/>
            <path d="M-9 52A59 59 0 0 1 109 52A59 59 0 0 1 93.85 91.48"/>
            <path d="M11.85 60.11A39 39 0 1 1 50 91"/>
            <path d="M50 91V125"/>

            <path d="M50 125V133Q49 137 46.5 136Q45 134.5 46 131"/>
          </g>
        </svg>
        50×57
      </div>
      <div class="size-chip">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -28 148 170" width="100" height="115" fill="none" aria-hidden="true">
          <g transform="rotate(-40 50 55)" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 -11.5V-13.5"/>
            <path d="M-9 52A59 59 0 0 1 109 52A59 59 0 0 1 93.85 91.48"/>
            <path d="M11.85 60.11A39 39 0 1 1 50 91"/>
            <path d="M50 91V125"/>
            <path d="M36 103H64"/>
            <path d="M50 125V133Q49 137 46.5 136Q45 134.5 46 131"/>
          </g>
        </svg>
        100×115
      </div>
      <div class="size-chip">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -28 148 170" width="150" height="172" fill="none" aria-hidden="true">
          <g transform="rotate(-40 50 55)" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <path d="M50 -11.5V-13.5"/>
            <path d="M-9 52A59 59 0 0 1 109 52A59 59 0 0 1 93.85 91.48"/>
            <path d="M11.85 60.11A39 39 0 1 1 50 91"/>
            <path d="M50 91V125"/>
            <path d="M36 103H64"/>
            <path d="M50 125V133Q49 137 46.5 136Q45 134.5 46 131"/>
          </g>
        </svg>
        150×172
      </div>
    </div>

    <div class="downloads">
      <a href="/images/hw-mg-ji-icon.svg" download="hw-mg-ji-icon.svg">Download SVG</a>
      <a href="/images/hw-mg-ji-icon@512.png" download="hw-mg-ji-icon.png">Download PNG (512px)</a>
    </div>
  </div>
</body>
</html>
