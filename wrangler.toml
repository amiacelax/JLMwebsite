name = "japanese-language-mentor"
account_id = "ec76ee6b6ba9798967983f0f4d7f1437"
main = "src/index.ts"
compatibility_date = "2026-05-20"
workers_dev = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
# SPA fallback is for unknown page routes. run_worker_first MUST list /api/*
# or Sec-Fetch-Mode: navigate can serve index.html instead of the Worker
# (compatibility_date >= 2025-04-01 assets_navigation_prefers_asset_serving).
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/preview/*", "/homework/platform", "/homework/platform.html", "/homework.html", "/homework", "/homework-hub", "/homework-hub/", "/homework-hub.html"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "HOMEWORK_KV"
id = "7e0eeef7af724f49ad5985302ea6fdc6"
preview_id = "75771c0dd6174e8593a354fab3b7709e"

[vars]
HARRIS_PREVIEW_USER = "harris"
JEM_PREVIEW_USER = "jem"
# All site Discord pings (contact, promo, birthdays, social reminders, homework, vids)
# → channel 1534083802102501539 (create/move webhooks into this channel)
DISCORD_CHANNEL_ID = "1534083802102501539"
DISCORD_HOMEWORK_CHANNEL_ID = "1534083802102501539"
# Contact / promo Gmail copies. Cloudflare Email Routing sends them (no Resend key required).
INQUIRY_EMAIL_TO = "languagementor.jp@gmail.com"
INQUIRY_EMAIL_FROM = "Japanese Language Mentor <inquiries@japaneselanguagementor.com>"
ACCOUNT_EMAIL_FROM = "Japanese Language Mentor <JD@japaneselanguagementor.com>"

# 00:00 UTC daily ≈ 9:00am Japan — student birthday Discord reminders
# 12:00 UTC daily = 9:00pm Japan — HW waiting daily Discord ping
# * * * * * — Shorts/Reels social reminder jobs (HOMEWORK_KV sr-pending:*)
[triggers]
crons = ["0 0 * * *", "0 12 * * *", "* * * * *"]

# Contact/promo copies → Gmail. Enable Email Routing on japaneselanguagementor.com first
# (Cloudflare dashboard → Email → Email Routing → Get started, verify Gmail).
[[send_email]]
name = "SEND_EMAIL"
destination_address = "languagementor.jp@gmail.com"

# Password reset and other student mail (Email Sending / Workers Paid).
[[send_email]]
name = "SEND_EMAIL_OUT"
allowed_sender_addresses = ["JD@japaneselanguagementor.com"]
